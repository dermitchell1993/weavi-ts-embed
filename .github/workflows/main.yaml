on:
  push:
    branches:
      - main
    tags:
      - '**'
  pull_request:

env:
  NODE_VERSION: '18.x'

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    - name: "Install dependencies"
      run: npm ci
    - name: "Run checks"
      run: |
        npm run lint
        npm run format:check

  unit-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    - name: "Install dependencies"
      run: npm ci
    - name: "Cache test results"
      uses: actions/cache@v4
      with:
        path: |
          .vitest-cache
          node_modules/.vitest
        key: ${{ runner.os }}-vitest-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-vitest-
    - name: "Get changed files"
      id: changed-files
      uses: tj-actions/changed-files@v44
      with:
        files: |
          src/**/*.ts
          src/**/*.js
    - name: "Run unit tests"
      run: |
        if [[ "${{ steps.changed-files.outputs.any_changed }}" == "true" ]] || [[ "${{ github.event_name }}" == "push" ]]; then
          echo "Running full unit test suite..."
          npm run test:unit
        else
          echo "No source changes detected, running minimal unit tests..."
          npx vitest run src/unit.test.ts --reporter=verbose
        fi
    - name: "Run build"
      run: npm run build

  integration-tests:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      github.event_name == 'pull_request'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    - name: "Install dependencies"
      run: npm ci
    - name: "Cache Weaviate binaries"
      uses: actions/cache@v4
      with:
        path: ~/.cache/weaviate-embedded-*
        key: ${{ runner.os }}-weaviate-binaries-${{ hashFiles('src/**/*.ts') }}
        restore-keys: |
          ${{ runner.os }}-weaviate-binaries-
    - name: "Run integration tests"
      run: npm run test:integration
      env:
        CI: true

  publish:
    needs: [checks, unit-tests, integration-tests]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci && npm run build
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTOMATION_TOKEN }}
